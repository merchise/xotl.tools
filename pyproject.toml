[project]
name = "xotl.tools"
version = "3.6.0"
description = "Collection of usefull algorithms and other very disparate stuff"
authors = [
   { name = "Merchise Autrement", email="info@merchise.de" }
]
license="MIT"
readme="README.rst"
requires-python = ">=3.10"
homepage="https://gitlab.merchise.org/merchise/xotl.tools"
documentation="https://merchise-autrement.gitlab.io/xotl.tools/"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.7.1; python_version < '3.13'",
    "typing-extensions>=4.12.2; python_version == '3.13'",
    "typing-extensions>=4.14.1; python_version == '3.14'",
    "typing-extensions>=4.16.0; python_version >= '3.15'",
    "packaging>=23.2",
]


[dependency-groups]
typing = [
    "zuban~=0.10.1",
    "types-python-dateutil",
]
test = [
    "hypothesis~=6.91.0",
    "pytz>=2023.3.post1",
    "pytest~=7.4.4",
    "pytest-cov~=4.1.0",
    "pytest-xdist~=2.1",
    "coverage[toml]~=7.4.0",
    "tox~=4.16.0",
    "python-dateutil>=2.8.2",
    "pytest-insta~=0.2.0",
]
lint = [
    "ruff==0.17.*",
]
tooling = [
    "sphinx>=7.1.2",
    "ipython~=8.12.3",
    "furo>=2024.1.29",
    "watchdog>=4.0",
]
dev = [
    { include-group="typing" },
    { include-group="lint" },
    { include-group="tooling" },
    { include-group="test" },
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xotl.tools"


[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
  "E501", # line-length is left to the formatter
  "E731", # do not assign a `lambda` expression, use a `def` (we use it a lot)
]
preview = true


[tool.ruff.format]
preview = true


[tool.coverage.run]
branch = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "pragma: no-cover",
  "def __repr__",
  "def __hash__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "return NotImplemented",
  "if __name__ == .__main__.:",
  "if t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
]

omit = [
    "xotl/tools/release.py",
    "xotl/tools/dim/base.py",
    # Files which are difficult to test in every platform
    "xotl/tools/tasking/_greenlet_local.py"
]

fail_under = 71
skip_covered = true
show_missing = true


[tool.pyright]
strictParameterNoneValue = false
useLibraryCodeForTypes = true
reportUnusedImport = true
reportUnusedClass = true
reportUnnecessaryCast = true
reportDuplicateImport = true
reportUnnecessaryTypeIgnoreComment = "warning"
reportShadowedImports = "warning"
stubPath = ""
include = [
  "xotl/tools",
]
